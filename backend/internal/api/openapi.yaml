openapi: 3.0.3
info:
  title: Витавто АРМ — vitauto-api
  version: 0.1.0
  description: |
    REST API нового стека (Go + PostgreSQL), контракт PWA. Источник истины: из него генерируются
    интерфейсы Go (oapi-codegen) и типы PWA (openapi-typescript), см. docs/migration/TZ.md, ТР-А1…А4.

    Контракт перенесён из `openapi/arm-pwa.openapi.yaml` (v2.7, ветка api) и `arm-pwa-process.openapi.yaml` (v2.9)
    и дополнен операциями, которые PWA уже вызывает через OData-бэкенд (`pwa/src/odata/backend.js`):
    отклонение комплектации, печать, уведомления, справочники товаров / услуг / машин.
    Тест паритета (`backend/internal/api/parity_test.go`) проверяет, что каждый маршрут `backend.js` описан здесь.

    Роль интерфейса и матрица прав: docs/migration/ddd/generated/roles-matrix.md. Изменения строк требуют
    актуальной версии (`If-Match`, этап 6 плана) — иначе `409 conflict`.

    Версия OpenAPI — 3.0.3: генератор oapi-codegen (kin-openapi) поддерживает 3.1 не полностью.
  contact:
    name: Витавто
servers:
  - url: /api/v1
    description: vitauto-api
tags:
  - name: system
    description: Состояние сервиса
  - name: session
    description: Вход и роль интерфейса
  - name: matrix
    description: Колонки и права редактирования
  - name: lines
    description: Строки АРМ (агрегат Line)
  - name: sales
    description: Команды продаж
  - name: supply
    description: Канбан снабжения
  - name: documents
    description: Документы и печатные формы
  - name: directories
    description: Списки для полей «выбор»
  - name: catalog
    description: Разделы «Товары», «Услуги», «Машины»
  - name: notifications
    description: Уведомления ролей
  - name: jobs
    description: Фоновые задания («В работе»)
  - name: returns
    description: Возвраты (от клиента, поставщику)
  - name: access
    description: Запросы доступа и решения администратора
  - name: unidentified
    description: Неопознанные позиции
  - name: workshop
    description: Заказ-наряды автосервиса
  - name: realtime
    description: Сигнальный канал WebSocket
security:
  - bearerAuth: []
paths:
  /session:
    post:
      tags: [session]
      summary: Войти пользователем информационной базы
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [session]
      summary: Текущая сессия, роль и какой экран открывать
      operationId: getSession
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [session]
      summary: Выйти
      operationId: logout
      responses:
        '204':
          description: Сессия закрыта
  /matrix:
    get:
      tags: [matrix]
      summary: Колонки матрицы для текущего экрана
      description: |
        Порядок, коды (А1…Т1), заголовки и тип поля. Для роли сессии у каждой колонки
        маска по 15 статусам уровня «Заказ»: `+` можно, `c` только создатель, `.` нельзя.
        PWA по этой маске рисует ячейку до ответа `PATCH`.
      operationId: getMatrix
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Матрица колонок
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Matrix'
        '304':
          description: Не изменилась
  /lines:
    get:
      tags: [lines]
      summary: Список строк продаж, закупок или снабжения
      operationId: listLines
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [sales, purchases, supply]
          description: |
            `sales` — таблица продаж. `purchases` — таблица закупок под ней.
            `supply` — канбан снабжения (только роль supply).
        - name: periodFrom
          in: query
          schema:
            type: string
            format: date
        - name: periodTo
          in: query
          schema:
            type: string
            format: date
        - name: customerOrderId
          in: query
          schema:
            type: string
            format: uuid
          description: Отбор после загрузки данных покупателя («ОбновитьСписокАРМ»)
        - name: hideShipped
          in: query
          schema:
            type: boolean
            default: false
        - name: hideDeleted
          in: query
          schema:
            type: boolean
            default: false
          description: Скрыть вычеркнутые
        - name: onlyWithPurchases
          in: query
          schema:
            type: boolean
            default: false
        - name: groupByCustomerOrder
          in: query
          schema:
            type: boolean
            default: false
        - name: clientOrderNumber
          in: query
          schema:
            type: string
          description: Отбор по «№ заказа клиента» (В5)
        - name: factArticle
          in: query
          schema:
            type: string
          description: Отбор по артикулу «как написал клиент» (К5)
        - name: warehouseId
          in: query
          schema:
            type: string
            format: uuid
          description: Отбор по складу строки (Н6 — ячейка/склад)
        - name: status
          in: query
          schema:
            type: string
          description: |
            Отбор по статусу API (код матрицы: new, in_work, partially_ordered, ordered, paid,
            in_transit, awaiting_receipt, acceptance, to_stock, reserve, assembly, ready_to_ship,
            shipped, return, closed). Несколько — через запятую.
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Страница строк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinePage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [lines]
      summary: Добавить строки подбором номенклатуры
      description: Команды «Добавить строки» в продажах и в закупках.
      operationId: addLines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLinesRequest'
      responses:
        '201':
          description: Созданные строки
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Line'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/LineId'
    get:
      tags: [lines]
      summary: Одна строка
      operationId: getLine
      responses:
        '200':
          description: Строка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [lines]
      summary: Записать одно поле строки
      description: |
        То же, что правка ячейки в форме продаж (`ЗаписатьПолеСтрокиАРМ`) и отдельные
        обработчики выбора (номенклатура, партия, договор, поставщик, вид услуги,
        форма оплаты, количество, цена, коэффициент, комментарий, дата и номер отгрузки).
        После записи сервер пересчитывает сумму себестоимости, цену продажи и наценку (%)
        по формулам матрицы и возвращает строку целиком. Цена продажи = себестоимость единицы
        × (1 + наценка / 100); при ручном вводе цены наценка = (цена / себестоимость − 1) × 100.
      operationId: patchLineField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldPatch'
      responses:
        '200':
          description: Строка после записи и пересчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [lines]
      summary: Вычеркнуть или удалить строку
      description: Команды «Удалить строку» и «Удалить текущую строку».
      operationId: deleteLine
      responses:
        '204':
          description: Строка вычеркнута
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /lines/{lineId}/mark:
    parameters:
      - $ref: '#/components/parameters/LineId'
    post:
      tags: [lines]
      summary: Переключить отметку строки
      description: |
        Флажок «поле выбора ячеек». Ставит автор отметки; снять чужую отметку нельзя.
      operationId: toggleLineMark
      responses:
        '200':
          description: Новое состояние отметки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Line'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /selection:
    get:
      tags: [lines]
      summary: Сумма и количество по отмеченным строкам
      operationId: selectionTotals
      parameters:
        - name: view
          in: query
          required: true
          schema:
            type: string
            enum: [sales, purchases, supply]
      responses:
        '200':
          description: Итоги выделения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectionTotals'
    post:
      tags: [lines]
      summary: Отметить все строки заказа
      description: «Выделить все строки заказа» в продажах, закупках или снабжении.
      operationId: markOrderLines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view, customerOrderId, marked]
              properties:
                view:
                  type: string
                  enum: [sales, purchases, supply]
                customerOrderId:
                  type: string
                  format: uuid
                marked:
                  type: boolean
      responses:
        '200':
          description: Сколько строк изменилось
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
  /sales/jobs:
    post:
      tags: [sales, jobs]
      summary: «В работе» — фоновая обработка отмеченных строк
      description: |
        Берёт отмеченные ключи связи в статусах «Черновик», «В работе», «Собран».
        Ставит интерфейсный замок и запускает фоновое задание. `allowSplit=false` —
        первый запуск; если задание просит подтверждение сплита, PWA повторяет вызов
        с `allowSplit=true` (диалог «В работе»).
      operationId: startInWork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowSplit]
              properties:
                allowSplit:
                  type: boolean
      responses:
        '202':
          description: Задание поставлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/prepared:
    post:
      tags: [sales]
      summary: «Подготовлено»
      description: |
        Отмеченные строки продажи в статусе «В работе», с номенклатурой, поставщиком,
        количеством и ценой, без незавершённой закупки по тому же ключу связи,
        переводятся в «Подготовлено». Иначе `409` «в строках есть незавершённые закупки».
      operationId: markPrepared
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/customer-orders:
    post:
      tags: [sales, documents]
      summary: Создать заказ покупателя
      operationId: createCustomerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOrderDraft'
      responses:
        '201':
          description: Документ создан, строки попали в регистр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRef'
  /sales/customer-orders/{documentId}/post:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [sales, documents]
      summary: Провести заказ покупателя по отмеченным строкам
      operationId: postCustomerOrder
      responses:
        '200':
          description: Проведён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/customer-orders/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    delete:
      tags: [sales, documents]
      summary: Удалить заказ покупателя
      operationId: deleteCustomerOrder
      responses:
        '204':
          description: Удалён
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/supplier-orders:
    post:
      tags: [sales, documents]
      summary: Создать заказы поставщикам по выбранным закупкам (один заказ на поставщика, договор и заказ покупателя)
      operationId: createSupplierOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineIds]
              properties:
                lineIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  description: Строки закупок, отмеченные текущим пользователем (id строки АРМ)
      responses:
        '201':
          description: Созданные заказы поставщикам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sales/shipments:
    post:
      tags: [sales]
      summary: Заполнить дату и номер отгрузки по заказу
      operationId: fillShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerOrderId, shipmentDate, shipmentNumber]
              properties:
                customerOrderId:
                  type: string
                  format: uuid
                shipmentDate:
                  type: string
                  format: date
                shipmentNumber:
                  type: string
      responses:
        '200':
          description: Сколько строк обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /sales/imports:
    post:
      tags: [sales]
      summary: Загрузить таблицу от покупателя
      description: |
        Форма «Загрузка данных». Колонки листа как в загрузке заказа покупателя:
        номер клиента, срочность, госномер, территория, артикул, наименование, количество.
        После успеха список продаж отбирается по созданному заказу.
      operationId: importCustomerSheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSheet'
      responses:
        '201':
          description: Заказ и строки созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRef'
        '400':
          $ref: '#/components/responses/BadRequest'
  /sales/imports/file:
    post:
      tags: [sales]
      summary: Загрузить файл листа покупателя (M1, ТЧИ1)
      description: |
        To же, что `POST /sales/imports`, но лист передаётся файлом (.xlsx или .csv) в multipart-форме.
        Колонки опознаются по коду шаблона АРМ: К1Срочность, К2Машина, К3Территория, К4Наименование,
        К5Артикул, К6Кол-во, N0Кол-во, V4/V5 номера заказа. Пустое количество принимается за 1
        с предупреждением; в ответе — созданный документ и список предупреждений разбора.
      operationId: importCustomerFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, customerId]
              properties:
                file:
                  type: string
                  format: binary
                  description: Лист покупателя (.xlsx, .xlsm или .csv), до 32 МиБ
                customerId:
                  type: string
                  format: uuid
                contractId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Заказ создан, строки в регистре
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc:
                    $ref: '#/components/schemas/DocumentRef'
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /supply/status:
    post:
      tags: [supply]
      summary: Перевести отмеченные закупки в статус канбана
      description: |
        Кнопки формы снабжения. `assembled` при частичном приходе требует `receiptDate`
        (вопрос «частичный приход» в форме).
      operationId: setSupplyStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyStatusRequest'
      responses:
        '200':
          description: Сколько позиций переведено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [jobs]
      summary: Статус фонового задания «В работе»
      description: PWA опрашивает, пока `state` не станет `done`, `need_split` или `failed`.
      operationId: getJob
      responses:
        '200':
          description: Состояние задания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /documents/{kind}/{documentId}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [customer_order, supplier_order, receipt, shipment]
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Карточка документа, который АРМ открывает из строки
      description: |
        «Показать заказ покупателя», «заказ поставщику», «приходную» и «расходную накладную».
        PWA показывает шапку и ссылку; проведение остаётся командами `/sales/...`.
      operationId: getDocument
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /directories/counterparties:
    get:
      tags: [directories]
      summary: Заказчики и поставщики
      operationId: listCounterparties
      parameters:
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: Контрагенты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedRef'
  /directories/contracts:
    get:
      tags: [directories]
      summary: Договоры выбранного контрагента
      operationId: listContracts
      parameters:
        - name: ownerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Только договоры этого владельца
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamedRef'
  /directories/nomenclature:
    get:
      tags: [directories]
      summary: Поиск номенклатуры по наименованию, артикулу или коду А-А
      operationId: searchNomenclature
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Найденные позиции
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NomenclatureItem'
  /directories/batches:
    get:
      tags: [directories]
      summary: Партии ФИФО для номенклатуры строки
      operationId: listBatches
      parameters:
        - name: nomenclatureId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: customerOrderId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Партии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchItem'
  /directories/service-types:
