                items:
                  $ref: '#/components/schemas/Cell'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lines/{lineId}/cell:
    parameters:
      - $ref: '#/components/parameters/LineId'
    post:
      tags: [lines]
      summary: Разместить закупку в ячейке (K2)
      description: |
        Кладовщик привязывает ячейку к закупке в статусе «ПриходУется»; строка автоматически
        переходит в «НаСкладе» (уведомление M8 менеджеру даёт триггер БД).
      operationId: placeLineCell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cellId]
              properties:
                cellId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Размещено
          content:
            application/json:
              schema:
                type: object
                properties:
                  placed:
                    type: boolean
                  status:
                    type: string
                    description: Код нового статуса (обычно `to_stock`)
                  cellId:
                    type: string
                    format: uuid
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /ws:
    get:
      tags: [realtime]
      summary: Сигнальный WebSocket (только уведомления об изменениях)
      description: |
        Единственный real-time канал. **Данных не переносит** — только сигналы, какой GET-эндпоинт
        устарел. PWA по сигналу перевызывает список и держит актуальные данные в сессии.
        Аутентификация: заголовок `Authorization: Bearer <token>` при handshake либо query-параметр
        `token` (браузерные WebSocket заголовок не шлют).

        Рамки сервера (JSON, минимальный размер):

        | kind      | назначение                                                        |
        |-----------|-------------------------------------------------------------------|
        | `change`  | батч сигналов `[{e,id,op}]`; `e` → эндпоинт: `line`→`/lines`, `return`→`/returns`, `work_order`→`/work-orders`, `unidentified`→`/unidentified`, `access_request`→`/access-requests` |
        | `notice`  | `{noticeId,node}` — перечитать `GET /notifications`                |
        | `resync`  | очередь переполнена — перезагрузить экран целиком                  |
        | `ping`    | keepalive, клиент отвечает `{"kind":"pong"}`                       |

        Отправка батча `change` — с дебаунсом 300 мс на клиент, не чаще одного сообщения на всплеск
        изменений. Формат и правила — `asyncapi.yaml` (v0.2.0).
      parameters:
        - name: token
          in: query
          required: false
          description: Токен сеанса (для браузерных WebSocket, которые не шлют Authorization)
          schema:
            type: string
      operationId: openWebSocket
      responses:
        '101':
          description: Switching Protocols — сигнальный канал открыт
        '401':
          $ref: '#/components/responses/Unauthorized'
