Define SRVROOT "D:/1c/apache/Apache24"
ServerRoot "${SRVROOT}"
Listen 127.0.0.1:8090
ServerName localhost:8090
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
ErrorLog "D:/1c/apache/error.log"
LogFormat "%h %t \"%r\" %>s %b %D" common
CustomLog "D:/1c/apache/access.log" common
PidFile "D:/1c/apache/httpd.pid"
LoadModule _1cws_module "D:/1c/msi_admin/program files/1cv8/8.3.27.2342/bin/wsap24.dll"
# 1C wsap treats Authorization: Bearer as a 1C access token -> move it aside for the ARM API
SetEnvIf Authorization "(.+)" ARM_AUTH=$1
RequestHeader set X-Arm-Authorization "%{ARM_AUTH}e" env=ARM_AUTH
RequestHeader unset Authorization env=ARM_AUTH
Alias "/vitauto" "D:/1c/pub/vitauto/"
<Directory "D:/1c/pub/vitauto/">
    AllowOverride All
    Options None
    Require all granted
    SetHandler 1c-application
    ManagedApplicationDescriptor "D:/1c/pub/vitauto/default.vrd"
</Directory>