    LineStatus:
      type: string
      description: |
        Статусы матрицы и технические статусы АРМ.
        `prepared` покрывает Подготовлено и Собран. `closed` покрывает Выполнено и Завершено.
      enum:
        - new
        - in_work
        - partially_ordered
        - ordered
        - paid
        - in_transit
        - awaiting_receipt
        - acceptance
        - to_stock
        - reserve
        - assembly
        - ready_to_ship
        - shipped
        - return
        - closed
        - locked_background
